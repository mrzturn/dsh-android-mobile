name: Release APK

# Pushing a vX.Y.Z tag builds the release APK and attaches it to the
# GitHub release for that tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Extract version from tag
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          MAJOR="${TAG%%.*}"; REST="${TAG#*.}"
          MINOR="${REST%%.*}"; PATCH="${REST#*.}"
          PATCH="${PATCH%%[.-]*}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 10000 + MINOR * 100 + PATCH))" >> "$GITHUB_OUTPUT"
          echo "apk=dsh-mobile-$TAG.apk" >> "$GITHUB_OUTPUT"
      - name: Build release APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:testDebugUnitTest

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${{ steps.ver.outputs.apk }}"

      - name: Create GitHub release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/${{ steps.ver.outputs.apk }}
          fail_on_unmatched_files: true
